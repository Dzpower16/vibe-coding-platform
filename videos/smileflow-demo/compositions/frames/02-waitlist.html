  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.0–2.0s): phone arrives, alert detects the cancellation =====

      // Hero (phone) arrives fast so the subject is visible by t<=0.5s.
      tl.fromTo(
        "#02-waitlist-phone",
        { scale: 0.96, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0,
      );

      tl.fromTo(
        "#02-waitlist-agenda-bg",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.15,
      );

      // Alert pill — spring-pop entrance, controlled settle, no overshoot.
      tl.fromTo(
        "#02-waitlist-alert",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.35,
      );

      // Agenda backdrop clears as the thread is about to take over.
      tl.to("#02-waitlist-agenda-bg", { opacity: 0, duration: 0.3, ease: "power1.out" }, 2.0);

      // ===== Scene 2 (2.0–5.0s): the SMS thread slides up, message types on, sends =====

      tl.fromTo(
        "#02-waitlist-thread",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.0,
      );

      tl.fromTo(
        "#02-waitlist-bubble-out",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        2.6,
      );

      // Character-by-character type-on (smooth slice — discrete-text-sequence).
      (function () {
        var fullText = "Une place vient de se libérer — ça vous intéresse?";
        var el = document.getElementById("02-waitlist-bubble-out-text");
        var len = { v: 0 };
        tl.to(
          len,
          {
            v: fullText.length,
            duration: 1.5,
            ease: "power1.inOut",
            onUpdate: function () {
              el.textContent = fullText.substring(0, Math.floor(len.v));
            },
          },
          2.9,
        );
      })();

      // Sending indicator — three pulsing dots, phase-offset sine loop.
      tl.fromTo(
        "#02-waitlist-dots",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" },
        4.5,
      );
      (function () {
        var dots = [
          document.getElementById("02-waitlist-dot-1"),
          document.getElementById("02-waitlist-dot-2"),
          document.getElementById("02-waitlist-dot-3"),
        ];
        var phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 3.5,
            duration: 0.5,
            ease: "none",
            onUpdate: function () {
              dots.forEach(function (d, i) {
                var s = Math.sin(phase.p + i * (Math.PI / 2.2));
                var scale = 1 + s * 0.35;
                d.style.transform = "scale(" + Math.max(0.55, scale) + ")";
                d.style.opacity = String(0.55 + Math.max(0, s) * 0.45);
              });
            },
          },
          4.5,
        );
      })();
      // Dots die the instant the result lands — their clip window ends exactly at 5.0.

      // ===== Scene 3 (5.0–7.2s): the reply lands =====

      tl.fromTo(
        ["#02-waitlist-avatar", "#02-waitlist-bubble-in-inner"],
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 },
        5.0,
      );

      // ===== Scene 4 (7.2–9.088s): confirmation cascades in, badge flips, camera pushes in =====

      tl.fromTo(
        "#02-waitlist-confirm",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.2,
      );

      // Badge flip — scale-swap-transition (outline -> solid check), the one sanctioned
      // spring-pop of this frame.
      var BADGE_TRIGGER = 7.65;
      var BADGE_EXIT_DUR = 0.3;
      var BADGE_OVERLAP = 0.15;
      var BADGE_ENTER_DUR = 0.45;
      var BADGE_ENTER_START = BADGE_TRIGGER + BADGE_EXIT_DUR - BADGE_OVERLAP;

      tl.to(
        "#02-waitlist-badge-outline",
        { scale: 0.7, opacity: 0, duration: BADGE_EXIT_DUR, ease: "power2.in" },
        BADGE_TRIGGER,
      );
      tl.fromTo(
        "#02-waitlist-badge-solid",
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: BADGE_ENTER_DUR, ease: "back.out(1.6)" },
        BADGE_ENTER_START,
      );

      // Checkmark draw-in (svg-path-draw).
      (function () {
        var path = document.getElementById("02-waitlist-check-path");
        var len = path.getTotalLength();
        path.style.strokeDasharray = String(len);
        path.style.strokeDashoffset = String(len);
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
          BADGE_ENTER_START + 0.05,
        );
      })();

      // Camera push-in tight on the confirmation (coordinate-target-zoom).
      // The confirmation card is authored dead-center of the 1920x1080 canvas,
      // so the measured target offset is (0,0) — baked directly, no runtime
      // measurement needed, keeping timeline construction synchronous.
      var ZOOM_AT = 8.25;
      var ZOOM_DUR = 0.55;
      var ZOOM_SCALE = 2.2;
      var TARGET_OFFSET_X = 0;
      var TARGET_OFFSET_Y = 0;

      tl.to(
        "#02-waitlist-zoom-outer",
        { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT,
      );
      tl.to(
        "#02-waitlist-zoom-inner",
        { x: -TARGET_OFFSET_X, y: -TARGET_OFFSET_Y, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT,
      );

      window.__timelines["02-waitlist"] = tl;
    })();
  </script>
