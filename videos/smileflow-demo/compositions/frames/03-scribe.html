  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---- helper: smooth character-slice typewriter (discrete-text-sequence.md) ----
    function scribeTypeIn(el, fullText, start, dur) {
      const state = { n: 0 };
      tl.to(
        state,
        {
          n: fullText.length,
          duration: dur,
          ease: "power1.inOut",
          onUpdate: () => {
            el.textContent = fullText.slice(0, Math.floor(state.n));
          },
        },
        start,
      );
    }

    // ================= Scene 1 (0.0–1.3s) — working-state theater =================
    // Hero: blank note card + working pill, visible well before t<=0.5s.
    tl.fromTo(
      "#scribe-card",
      { opacity: 0, scale: 0.96 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
      0.02,
    );
    tl.fromTo(
      "#scribe-pill",
      { opacity: 0, scale: 0.85 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
      0.15,
    );

    // arc spinner rotation — svg-icon-enrichment (SVG transform attribute, explicit center)
    (function () {
      const hand = document.getElementById("scribe-spinner-svg").firstElementChild;
      const spin = { deg: 0 };
      tl.to(
        spin,
        {
          deg: 540, // 1.5 revolutions, finite
          duration: 1.15,
          ease: "none",
          onUpdate: () => hand.setAttribute("transform", `rotate(${spin.deg} 22 22)`),
        },
        0.15,
      );
    })();

    // pill hands off to the note (fast shrink+fade) as Scene 2 opens
    tl.to(
      "#scribe-pill",
      { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" },
      1.3,
    );

    // ================= Scene 2 (1.3–5.5s) — rows cascade + write in =================
    // Four rows, each: slide-up+fade entrance -> label types on -> content fills in,
    // paced to the VO naming "Subjectif, Objectif, Analyse, Plan".
    const ROWS = [
      {
        row: "#scribe-row-s",
        label: "#scribe-label-s",
        content: "#scribe-content-s",
        labelText: "Subjectif",
        contentText: "Sensibilité au froid, dent 36, depuis 3 jours.",
        slideStart: 1.3,
        labelStart: 1.6,
        labelDur: 0.16,
        contentStart: 1.78,
        contentDur: 0.53,
      },
      {
        row: "#scribe-row-o",
        label: "#scribe-label-o",
        content: "#scribe-content-o",
        labelText: "Objectif",
        contentText: "Carie occlusale visible, percussion négative.",
        slideStart: 2.39,
        labelStart: 2.69,
        labelDur: 0.16,
        contentStart: 2.87,
        contentDur: 0.52,
      },
      {
        row: "#scribe-row-a",
        label: "#scribe-label-a",
        content: "#scribe-content-a",
        labelText: "Analyse",
        contentText: "Pulpite réversible probable, dent 36.",
        slideStart: 3.47,
        labelStart: 3.77,
        labelDur: 0.16,
        contentStart: 3.95,
        contentDur: 0.42,
      },
      {
        row: "#scribe-row-p",
        label: "#scribe-label-p",
        content: "#scribe-content-p",
        labelText: "Plan",
        contentText: "Restauration composite, contrôle dans 2 semaines.",
        slideStart: 4.45,
        labelStart: 4.75,
        labelDur: 0.16,
        contentStart: 4.93,
        contentDur: 0.56,
      },
    ];

    ROWS.forEach((r) => {
      tl.fromTo(
        r.row,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        r.slideStart,
      );
      scribeTypeIn(document.querySelector(r.label), r.labelText, r.labelStart, r.labelDur);
      scribeTypeIn(document.querySelector(r.content), r.contentText, r.contentStart, r.contentDur);
    });

    // ================= Scene 3 (5.5–7.2s) — read-through sweep =================
    // Single top-to-bottom highlight pass over the settled rows. No new content, no camera move.
    tl.fromTo(
      "#scribe-sweep",
      { opacity: 0 },
      { opacity: 1, duration: 0.2, ease: "power1.out" },
      5.6,
    );
    tl.fromTo(
      "#scribe-sweep",
      { y: 0 },
      { y: 244, duration: 1.15, ease: "power1.inOut" },
      5.6,
    );
    tl.to("#scribe-sweep", { opacity: 0, duration: 0.2, ease: "power1.in" }, 6.75);

    // ================= Scene 4 (7.2–8.533s) — sign, one gesture =================
    // Button wakes, presses (linear compression), releases with a spring, badge flips
    // outline -> solid check, reassurance microcopy lands beside it, holds to the cut.
    tl.to("#scribe-btn", { opacity: 1, duration: 0.15, ease: "power2.out" }, 7.2);

    const PRESS_START = 7.35;
    const PRESS_DUR = 0.12;
    const RELEASE_START = PRESS_START + PRESS_DUR;
    const RELEASE_DUR = 0.45;

    tl.to(
      "#scribe-btn",
      { scale: 0.92, duration: PRESS_DUR, ease: "power1.in" },
      PRESS_START,
    );
    tl.to(
      "#scribe-btn",
      { scale: 1, duration: RELEASE_DUR, ease: "back.out(1.6)" },
      RELEASE_START,
    );

    // badge flip: outline -> solid check (scale-swap-transition + spring bounce)
    tl.to(
      "#scribe-badge-outline",
      { opacity: 0, duration: 0.15, ease: "power2.in" },
      RELEASE_START,
    );
    tl.fromTo(
      "#scribe-badge-check",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" },
      RELEASE_START,
    );

    // reassurance microcopy — small, text-light, never a legal block
    tl.fromTo(
      "#scribe-microcopy",
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      7.75,
    );

    window.__timelines["03-scribe"] = tl;
  </script>
